name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - tools/draw_parallel_card.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static page
        run: |
          mkdir -p _site
          cp tools/draw_parallel_card.html _site/index.html
          touch _site/.nojekyll
          cmp tools/draw_parallel_card.html _site/index.html
          sha256sum tools/draw_parallel_card.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
