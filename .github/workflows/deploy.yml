name: Manual VPS rollback deployment

on:
  # Kept for explicit rollback only; the workflow is disabled in GitHub.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Verify source
        run: sha256sum tools/draw_parallel_card.html

      - name: Upload and publish atomically
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            tools/draw_parallel_card.html "$VPS_USER@$VPS_HOST:/tmp/xy-train-5d-upload.html"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'sudo /usr/local/sbin/xy-train-5d-update /tmp/xy-train-5d-upload.html'
